---
deployment:
  tasks:
    - export DEPLOYPATH=/home/mwxntafa/erp.lecasu.co.mz/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R db $DEPLOYPATH
    - /bin/cp *.html $DEPLOYPATH
    - /bin/cp *.js $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp manifest.webmanifest $DEPLOYPATH
    - /bin/cp sw.js $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH 2>/dev/null || true
    - export ALTDEPLOYPATH=/home/mwxntafa/public_html/erp/
