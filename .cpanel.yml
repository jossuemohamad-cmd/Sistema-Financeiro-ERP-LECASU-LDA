    - /bin/cp *.js $ALTDEPLOYPATH
    - /bin/cp package.json $ALTDEPLOYPATH
    - /bin/cp manifest.webmanifest $ALTDEPLOYPATH
    - /bin/cp sw.js $ALTDEPLOYPATH
    - /bin/cp .htaccess $ALTDEPLOYPATH 2>/dev/null || true
    - export ALTDEPLOYPATH2=/home/mwxntafa/public_html/erp.lecasu.co.mz/
    - /bin/mkdir -p $ALTDEPLOYPATH2
    - /bin/cp -R assets $ALTDEPLOYPATH2
    - /bin/cp -R css $ALTDEPLOYPATH2
